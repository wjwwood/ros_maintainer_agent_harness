name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux apt-aligned Python versions (ROS 2 Rolling on Noble / Lyrical on Resolute)
          - name: Linux (apt / Python 3.12 - Rolling)
            os: ubuntu-latest
            python-version: '3.12'
          - name: Linux (apt / Python 3.13 - Lyrical)
            os: ubuntu-latest
            python-version: '3.13'

          # Pixi-aligned Python versions across platforms (conda-forge / pixi default)
          - name: Linux (pixi / Python 3.11)
            os: ubuntu-latest
            python-version: '3.11'
          - name: macOS (pixi / Python 3.11)
            os: macos-latest
            python-version: '3.11'
          - name: Windows (pixi / Python 3.11)
            os: windows-latest
            python-version: '3.11'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .
          python -m pip install flake8 pyyaml

      - name: Run Flake8 Linter
        if: runner.os == 'Linux'
        run: |
          flake8 src/ tests/ --max-line-length=120 --statistics

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
