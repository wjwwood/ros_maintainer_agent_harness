[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ros-maintainer-agent-harness"
version = "0.1.0"
description = "A development harness for AI agents assisting with ROS maintenance"
readme = "README.md"
authors = [{ name = "William Woodall", email = "wjwwood@google.com" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=5.3",
]

[project.scripts]
ros-maintainer-harness = "ros_maintainer_agent_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
